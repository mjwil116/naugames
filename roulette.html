<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800&family=Limelight&display=swap" rel="stylesheet">
<link rel="stylesheet" href="casino.css">
</head>
<body class="roulette">
<main class="shell">
<section class="cabinet">
<h1 class="title">Roulette</h1>
<p class="tagline">Pick a bet, spin the wheel, and wait for the ball to land.</p>

<div class="layout">
  <div>
    <div class="bar">
      <label for="table">Place a bet on</label>
      <select name="table" id="table">
    <option value="red">Red</option>
    <option value="black">Black</option>
    <option value="odd">Odd</option>
    <option value="even">Even</option>
    <option value="eighteen">1-18</option>
    <option value="thirtysix">19-36</option>
    <option value="dozen1">1st Dozen</option>
    <option value="dozen2">2nd Dozen</option>
    <option value="dozen3">3rd Dozen</option>
    <!-- Numbers 0-36 -->
    <option value="0">0</option><option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
    <option value="6">6</option><option value="7">7</option><option value="8">8</option>
    <option value="9">9</option><option value="10">10</option><option value="11">11</option>
    <option value="12">12</option><option value="13">13</option><option value="14">14</option>
    <option value="15">15</option><option value="16">16</option><option value="17">17</option>
    <option value="18">18</option><option value="19">19</option><option value="20">20</option>
    <option value="21">21</option><option value="22">22</option><option value="23">23</option>
    <option value="24">24</option><option value="25">25</option><option value="26">26</option>
    <option value="27">27</option><option value="28">28</option><option value="29">29</option>
    <option value="30">30</option><option value="31">31</option><option value="32">32</option>
    <option value="33">33</option><option value="34">34</option><option value="35">35</option>
    <option value="36">36</option>
  </select>
      <label for="bet">for</label>
      <input type="number" id="bet" name="bet" placeholder="Enter points amount">
      <button class="btn gold roll" onclick="generateNumber()">Roll</button>
    </div>
    <div class="reveal">
      <h1 id="result">Number: -</h1>
      <h1 id="earnings" class="readout">- points</h1>
      <div class="chips">
        <p id="resultColor">Color: -</p>
        <p id="resultTwelves">Dozen: -</p>
        <p id="resultLowHigh">Range: -</p>
        <p id="resultEvenOdd">Type: -</p>
      </div>
    </div>
  </div>
  <div class="stage" style="position: relative; margin-top: 40px; height: 350px;">
    <img id="wheel" src="roulette.jpg" style="transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); transform: rotate(0deg); max-width: 300px; display: block;">
    <img id="arrow" src="arrow.png" style="width: 40px; position: absolute; left: 130px; top: -20px; z-index: 10;">
</div>
</div>
</section>
<a class="back" href="index.html">Go Back</a>
</main>

<script>
    let currentRotation = 0;

    // Sound effects (files live in the sounds folder)
    const VOLUME = 0.5; // 0 = silent, 1 = full volume
    const sounds = {
        wheel: new Audio("sounds/wheel.mp3"),
        win:   new Audio("sounds/win.wav"),
        lose:  new Audio("sounds/lose.wav")
    };

    function playSound(name) {
        const s = sounds[name];
        s.volume = VOLUME;
        s.currentTime = 0;
        s.play().catch(() => {}); // ignore if a file is missing or the browser blocks it
    }
    
    function generateNumber() {
        // 1. Get input choices
        const betType = document.getElementById("table").value;
        const betInput = document.getElementById("bet").value;
        const betAmount = parseFloat(betInput);
        
        // Validation check
        if (isNaN(betAmount) || betAmount <= 0) {
            alert("Please enter a valid points amount before rolling!");
            return;
        }

        // Exact European Roulette Layout Order starting from 0 clockwise
        // Format: [Number, Color (0=G, 1=R, 2=B), Dozen (1,2,3), Range (1=1-18, 2=19-36), Even/Odd (0=Even, 1=Odd)]
        const lookUpTable = {
            0: [0, 0, 0, 0, -1],     1: [32, 2, 3, 2, 0],    2: [15, 2, 2, 1, 1],    3: [19, 1, 2, 2, 1],
            4: [4, 2, 1, 1, 0],     5: [21, 1, 2, 2, 1],    6: [2, 2, 1, 1, 0],     7: [25, 1, 3, 2, 1],
            8: [17, 2, 2, 1, 1],    9: [34, 1, 3, 2, 0],    10: [6, 2, 1, 1, 0],    11: [27, 1, 3, 2, 1],
            12: [13, 2, 2, 1, 1],   13: [36, 1, 3, 2, 0],   14: [11, 2, 1, 1, 1],   15: [30, 1, 3, 2, 0],
            16: [8, 2, 1, 1, 0],    17: [23, 1, 2, 2, 1],   18: [10, 2, 1, 1, 0],   19: [5, 1, 1, 1, 1],
            20: [24, 2, 2, 2, 0],   21: [16, 1, 2, 1, 0],   22: [33, 2, 3, 2, 1],   23: [1, 1, 1, 1, 1],
            24: [20, 2, 2, 2, 0],   25: [14, 1, 2, 1, 0],   26: [31, 2, 3, 2, 1],   27: [9, 1, 1, 1, 1],
            28: [22, 2, 2, 2, 0],   29: [18, 1, 2, 1, 0],   30: [29, 2, 3, 2, 1],   31: [7, 1, 1, 1, 1],
            32: [28, 2, 3, 2, 0],   33: [12, 1, 1, 1, 0],   34: [35, 2, 3, 2, 1],   35: [3, 1, 1, 1, 1],
            36: [26, 2, 3, 2, 0]
        };
        
        // 2. Compute roll
        const randomNum = Math.floor(Math.random() * 37);
        const selectedRow = lookUpTable[randomNum];
        
        const finalNumber = selectedRow[0];
        const colorCode   = selectedRow[1];
        const dozenCode   = selectedRow[2];
        const rangeCode   = selectedRow[3];
        const parityCode  = selectedRow[4];
        
        // 3. Wheel animation math
        const degreesPerSegment = 360 / 37;
        const targetDegrees = -(randomNum * degreesPerSegment);
        
        currentRotation -= 1800; // Adds 5 complete fast spins
        const finalRotation = Math.floor(currentRotation + targetDegrees);
        
        const wheelImg = document.getElementById("wheel");
        wheelImg.style.transform = `rotate(${finalRotation}deg)`;
        playSound("wheel");
        
        // 4. Update core result texts directly
        document.getElementById("result").textContent = `Number: ${finalNumber}`;

        let colorText = "Green";
        if (colorCode === 1) colorText = "Red";
        if (colorCode === 2) colorText = "Black";
        document.getElementById("resultColor").textContent = `Color: ${colorText}`;
        
        document.getElementById("resultTwelves").textContent = `Dozen: ${dozenCode === 0 ? "None" : dozenCode}`;
        
        let rangeText = "None";
        if (rangeCode === 1) rangeText = "1-18";
        if (rangeCode === 2) rangeText = "19-36";
        document.getElementById("resultLowHigh").textContent = `Range: ${rangeText}`;
        
        let parityText = "None";
        if (parityCode === 0) parityText = "Even";
        if (parityCode === 1) parityText = "Odd";
        document.getElementById("resultEvenOdd").textContent = `Type: ${parityText}`;

        // 5. Calculate Betting Results
        let isWin = false;
        let payoutMultiplier = 0;

        if (betType === "red" && colorCode === 1) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "black" && colorCode === 2) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "even" && parityCode === 0) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "odd" && parityCode === 1) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "eighteen" && rangeCode === 1) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "thirtysix" && rangeCode === 2) { isWin = true; payoutMultiplier = 2; }
        else if (betType === "dozen1" && dozenCode === 1) { isWin = true; payoutMultiplier = 3; }
        else if (betType === "dozen2" && dozenCode === 2) { isWin = true; payoutMultiplier = 3; }
        else if (betType === "dozen3" && dozenCode === 3) { isWin = true; payoutMultiplier = 3; }
        else if (betType === finalNumber.toString()) { isWin = true; payoutMultiplier = 36; } 

        const earningsDisplay = document.getElementById("earnings");
        if (isWin) {
            const totalWon = betAmount * payoutMultiplier;
            earningsDisplay.textContent = `+${totalWon} points (Won!)`;
            earningsDisplay.style.color = "#2b8a3e";
        } else {
            earningsDisplay.textContent = `-${betAmount} points (Lost)`;
            earningsDisplay.style.color = "#c92a2a";
        }

        // Win/lose sound plays at the same moment the result appears on screen
        playSound(isWin ? "win" : "lose");
    }
</script>
</body>
</html>
